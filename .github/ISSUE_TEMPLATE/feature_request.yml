name: Feature request
description: Suggest an improvement to MindRepo.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what would make MindRepo more useful. Please use fictional examples and avoid sharing private knowledgebase content.
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context (optional)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: My request contains no private data or credentials.
          required: true
