name: Bug report
description: Report a problem with MindRepo setup, instructions, or templates.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! **Do not include private repository content, personal data, access tokens, or credentials.** Use fictional examples.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the issue.
      placeholder: The setup assistant asked for the repository name twice...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a test repository and fictional information.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: AI assistant / environment (optional)
      placeholder: ChatGPT with GitHub integration
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed private information, secrets, and identifying repository details.
          required: true
