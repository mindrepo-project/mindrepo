<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc"><title id="title">How MindRepo works</title><desc id="desc">A conversation passes through an AI assistant with GitHub access to a private Markdown repository, and relevant knowledge can be read back.</desc><rect width="1000" height="250" rx="18" fill="#f6f9fc"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><rect x="35" y="52" width="240" height="135" rx="18" fill="#e3edfa" stroke="#a3b9d1" stroke-width="2"/><text x="155" y="106" font-size="23" font-weight="700" fill="#17324e">Conversation</text><text x="155" y="139" font-size="16" fill="#42617b">You + your AI</text><rect x="381" y="52" width="240" height="135" rx="18" fill="#d9f5ed" stroke="#81bba9" stroke-width="2"/><text x="501" y="98" font-size="21" font-weight="700" fill="#153e37">AI assistant</text><text x="501" y="128" font-size="16" fill="#35685e">GitHub integration</text><text x="501" y="153" font-size="14" fill="#35685e">read / write access</text><rect x="727" y="52" width="240" height="135" rx="18" fill="#e3edfa" stroke="#a3b9d1" stroke-width="2"/><text x="847" y="95" font-size="22" font-weight="700" fill="#17324e">Private repo</text><text x="847" y="125" font-size="16" fill="#42617b">README · topics</text><text x="847" y="151" font-size="16" fill="#42617b">Markdown · CSV</text></g><g stroke="#2b6f7b" stroke-width="4" stroke-linecap="round" fill="none"><path d="M283 102H368"/><path d="M356 93l12 9-12 9"/><path d="M629 102H714"/><path d="M702 93l12 9-12 9"/><path d="M714 142H629"/><path d="M641 133l-12 9 12 9"/></g><text x="500" y="223" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="14" fill="#647b8d">Repository access depends on your assistant and permissions; no automatic sync is implied.</text></svg>