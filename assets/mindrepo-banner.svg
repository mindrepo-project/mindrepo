<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-labelledby="title desc"><title id="title">MindRepo</title><desc id="desc">A connected knowledge graph inside a repository, beside the MindRepo wordmark and tagline.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1225"/><stop offset="1" stop-color="#182c42"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#63e6be"/><stop offset="1" stop-color="#6bb9ff"/></linearGradient></defs><rect width="1100" height="280" rx="24" fill="url(#bg)"/><g opacity=".12" fill="none" stroke="#a6c8ff"><path d="M0 70H1100M0 140H1100M0 210H1100M110 0V280M220 0V280M330 0V280M440 0V280M550 0V280M660 0V280M770 0V280M880 0V280M990 0V280"/></g><g transform="translate(72 55)"><rect width="170" height="170" rx="36" fill="#132a3c" stroke="#6de4ca" stroke-width="3"/><path d="M42 48h38l18 19h34v61H42z" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linejoin="round"/><path d="M62 95L88 78L113 100M88 78L113 62" fill="none" stroke="#8bd6ff" stroke-width="5" stroke-linecap="round"/><circle cx="62" cy="95" r="8" fill="#63e6be"/><circle cx="88" cy="78" r="8" fill="#63e6be"/><circle cx="113" cy="100" r="8" fill="#63e6be"/><circle cx="113" cy="62" r="8" fill="#63e6be"/></g><text x="285" y="123" font-family="Arial,Helvetica,sans-serif" font-size="74" font-weight="750" fill="#f5f9ff">Mind<tspan fill="#63e6be">Repo</tspan></text><text x="288" y="172" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#b6c8da">Your AI's memory. Your repository. Your control.</text><text x="289" y="210" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#8faac1">No database. No server. Just Markdown + GitHub.</text></svg>